<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- dark rounded tile so it reads on light and dark tabs -->
  <rect width="64" height="64" rx="15" fill="#0a0e15" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" stroke="#1c2738" />

  <!-- target rings (brand cyan) -->
  <circle cx="27" cy="37" r="19" stroke="#22d3ee" stroke-width="4" />
  <circle cx="27" cy="37" r="11" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.55" />
  <circle cx="27" cy="37" r="4.5" fill="#67e8f9" />

  <!-- arrow hitting the bullseye (brand green) -->
  <g stroke="#4ade80" stroke-width="4" stroke-linecap="round">
    <line x1="53" y1="11" x2="34.1" y2="29.9" />
    <line x1="50" y1="8" x2="55" y2="13" stroke-width="3" />
    <line x1="47" y1="11" x2="52" y2="16" stroke-width="3" />
  </g>
  <polygon points="27,37 37.96,33.82 30.18,26.04" fill="#4ade80" />
</svg>
